# Fly.io — single instance with a persistent volume for SQLite, hosted in Mumbai (bom).
# fly launch --no-deploy --copy-config && fly volumes create hm_data --region bom --size 1
# fly secrets set APP_SECRET=... ADMIN_BOOTSTRAP_PASSWORD=... PUBLIC_URL=https://<app>.fly.dev
# fly deploy
app = "hungry-mango"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_URL = "sqlite:/app/data/hungry-mango.db"
  TRUST_PROXY = "1"
  ADMIN_BOOTSTRAP_USER = "owner"
  TABLE_COUNT = "12"
  TZ = "Asia/Kolkata"

[[mounts]]
  source = "hm_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"
