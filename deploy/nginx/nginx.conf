# nginx as the load balancer for docker-compose.scale.yml.
worker_processes auto;
events { worker_connections 8192; }

http {
  server_tokens off;
  client_max_body_size 2m;
  sendfile on;
  keepalive_timeout 65;

  # Cluster-wide request limits (each app instance also limits on its own).
  # A whole table usually shares one restaurant Wi-Fi IP, so join limits are generous.
  limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone $binary_remote_addr zone=join:10m  rate=30r/m;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;

  # Docker's DNS returns every "app" replica. "resolve" (nginx 1.27.3+) re-reads it
  # every 10 s, so replicas added, removed or recreated are picked up automatically.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream hungry_mango {
    zone hungry_mango 64k;
    least_conn;
    server app:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_next_upstream error timeout http_502 http_503;

  server {
    listen 80;
    # If you terminate TLS here instead of Cloudflare, redirect everything to HTTPS:
    # return 301 https://$host$request_uri;

    location ~ ^/api/(session|admin)/stream$ {
      proxy_pass http://hungry_mango;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }
    location = /api/admin/login       { limit_req zone=login burst=5 nodelay;  proxy_pass http://hungry_mango; }
    location ~ ^/api/tables/\d+/join$ { limit_req zone=join  burst=20 nodelay; proxy_pass http://hungry_mango; }
    location /api/                    { limit_req zone=api   burst=60 nodelay; proxy_pass http://hungry_mango; }
    location = /metrics               { allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; deny all; proxy_pass http://hungry_mango; }
    location /                        { proxy_pass http://hungry_mango; }
  }

  # HTTPS (uncomment, put fullchain.pem + privkey.pem in deploy/nginx/certs/)
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ... copy the location blocks from above ...
  # }
}
